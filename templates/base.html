<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}বাংলা সাইন ট্রান্সলেটর{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='/images/favicon.png') }}" type="image/png">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <img src="{{ url_for('static', filename='../static/images/logo.png') }}" alt="Logo">
                <h1>বাংলা সাইন ট্রান্সলেটর</h1>
            </div>
            <ul class="nav-links">
                <li><a href="{{ url_for('index') }}" class="{% if request.path == '/' %}active{% endif %}">হোম</a></li>
                <li><a href="{{ url_for('sign_page') }}" class="{% if request.path == '/sign' %}active{% endif %}">সাইন</a></li>
                <li><a href="{{ url_for('learn_page') }}" class="{% if request.path == '/learn' %}active{% endif %}">শিখুন</a></li>
                <li><a href="{{ url_for('about_page') }}" class="{% if request.path == '/about' %}active{% endif %}">সম্পর্কে</a></li>
            </ul>
            <div class="menu-toggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 বাংলা সাইন ট্রান্সলেটর | সর্বসত্ব সংরক্ষিত</p>
            <div class="social-links">
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-github"></i></a>
                <a href="#"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
